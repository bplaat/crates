[package]
name = "example-persons-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
bsqlite = { version = "0.1.2", features = ["jiff", "uuid"] }
dotenv = "0.15.0"
from_derive = { path = "../../lib/from_derive" }
jiff = { version = "0.2.35", features = ["serde"] }
log = "0.4.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7.1"
simple_logger = "5.2"
small-http = { version = "0.2.1", features = ["json", "form", "cgi", "log"] }
small-router = { version = "0.2.1", features = ["log"] }
uuid = { version = "1.25", features = ["v7", "serde"] }
validate = { path = "../../lib/validate" }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
bsqlite = { version = "0.1.2", features = ["bundled", "jiff", "uuid"] }

[build-dependencies]
openapi-generator = { path = "../../lib/openapi-generator" }
