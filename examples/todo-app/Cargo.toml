[package]
name = "example-todo-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bwebview = { path = "../../lib/bwebview", default-features = false, features = [
    "rust-embed",
    "remember_window_state",
] }
directories = "6.0"
rust-embed = { version = "8.12", features = ["interpolate-folder-path"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.25", features = ["serde"] }
