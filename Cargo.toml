[workspace]
members = [
    "apps/*/*",
    "games/*",
    "lib/*/examples/*",
    "lib/apple/*",
    "lib/base64",
    "lib/bsql",
    "lib/bsql_derive",
    "lib/chrono",
    "lib/copy_dir",
    "lib/criterion",
    "lib/digest",
    "lib/directories",
    "lib/enable-ansi-support",
    "lib/from_derive",
    "lib/getrandom",
    "lib/graphics/*",
    "lib/graphics/*/examples/*",
    "lib/gzip",
    "lib/hmac",
    "lib/js",
    "lib/keyring",
    "lib/libsqlite3-sys",
    "lib/local-ip-address",
    "lib/maxminddb",
    "lib/mime",
    "lib/mime_guess",
    "lib/native-tls",
    "lib/openapi-generator",
    "lib/pbkdf2",
    "lib/plist",
    "lib/regex",
    "lib/rusb",
    "lib/rust-embed",
    "lib/rust-embed-impl",
    "lib/serde_yaml",
    "lib/sha1",
    "lib/sha2",
    "lib/simple-useragent",
    "lib/simple_logger",
    "lib/small-http",
    "lib/small-router",
    "lib/small-websocket",
    "lib/terminal_size",
    "lib/threadpool",
    "lib/trybuild",
    "lib/ui/*",
    "lib/ui/*/examples/*",
    "lib/url",
    "lib/uuid",
    "lib/validate",
    "lib/validate_derive",
    "lib/winresource",
    "lib/zip",
    "tools/*",
]
exclude = ["games/plaatcraft", "lib/ui/plaatui"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Bastiaan van der Plaat <bastiaan.v.d.plaat@gmail.com>"]
repository = "https://github.com/bplaat/crates"

[workspace.lints.rust]
warnings = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
missing_docs = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
missing_const_for_fn = "deny"

[patch.crates-io]
base64 = { path = "lib/base64" }
block2 = { path = "lib/apple/block2" }
bsql = { path = "lib/bsql" }
bsql_derive = { path = "lib/bsql_derive" }
chrono = { path = "lib/chrono" }
copy_dir = { path = "lib/copy_dir" }
digest = { path = "lib/digest" }
directories = { path = "lib/directories" }
enable-ansi-support = { path = "lib/enable-ansi-support" }
getrandom = { path = "lib/getrandom" }
hmac = { path = "lib/hmac" }
keyring = { path = "lib/keyring" }
libsqlite3-sys = { path = "lib/libsqlite3-sys" }
local-ip-address = { path = "lib/local-ip-address" }
maxminddb = { path = "lib/maxminddb" }
mime = { path = "lib/mime" }
mime_guess = { path = "lib/mime_guess" }
native-tls = { path = "lib/native-tls" }
objc2 = { path = "lib/apple/objc2" }
objc2-proc-macros = { path = "lib/apple/objc2-proc-macros" }
plist = { path = "lib/plist" }
regex = { path = "lib/regex" }
rusb = { path = "lib/rusb" }
rust-embed = { path = "lib/rust-embed" }
rust-embed-impl = { path = "lib/rust-embed-impl" }
serde_yaml = { path = "lib/serde_yaml" }
sha1 = { path = "lib/sha1" }
sha2 = { path = "lib/sha2" }
simple-useragent = { path = "lib/simple-useragent" }
simple_logger = { path = "lib/simple_logger" }
small-http = { path = "lib/small-http" }
small-router = { path = "lib/small-router" }
terminal_size = { path = "lib/terminal_size" }
threadpool = { path = "lib/threadpool" }
trybuild = { path = "lib/trybuild" }
url = { path = "lib/url" }
uuid = { path = "lib/uuid" }
winresource = { path = "lib/winresource" }
zip = { path = "lib/zip" }

[profile.release]
opt-level = "z"
lto = "thin"
strip = true
panic = "abort"
overflow-checks = false

[profile.release.package.image]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.pbkdf2]
opt-level = 3

[profile.release.package.reversi-engine]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3
