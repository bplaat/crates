[package]
name = "small-websocket"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
getrandom = { version = "0.4.3", optional = true }
sha1 = "0.11.0"
small-http = { version = "0.2.1", default-features = false }
url = { version = "2.5", optional = true }

[dev-dependencies]
small-http = "0.2.1"

[features]
default = ["client"]
client = ["dep:getrandom", "dep:url"]
