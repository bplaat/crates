[package]
name = "image"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
path = "src/mod.rs"

[features]
default = ["qoi", "jpeg", "png", "gif", "bmp", "ico"]
qoi = []
jpeg = []
png = ["dep:miniz_oxide"]
gif = []
bmp = []
ico = ["bmp", "png"]

[dependencies]
miniz_oxide = { version = "0.9.1", optional = true }
