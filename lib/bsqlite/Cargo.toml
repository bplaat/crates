[package]
name = "bsqlite"
version = "0.1.2"
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version = "1.65"
description = "A simple and minimal Rust SQLite library with an ergonomic API"
categories = ["database", "web-programming"]
keywords = ["sql", "sqlite", "database", "bsqlite"]
homepage = "https://github.com/bplaat/crates/tree/master/lib/bsqlite"

[lints]
workspace = true

[dependencies]
bsqlite_derive = { version = "0.1.1", optional = true }
jiff = { version = "0.2.35", optional = true }
libsqlite3-sys = "0.38.2"
uuid = { version = "1.25", optional = true }

[dev-dependencies]
anyhow = "1.0"
jiff = "0.2.35"
uuid = { version = "1.25", features = ["v7"] }

[features]
default = ["derive"]
bundled = ["libsqlite3-sys/bundled"]
derive = ["dep:bsqlite_derive"]
jiff = ["dep:jiff"]
uuid = ["dep:uuid"]
