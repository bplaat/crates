[package]
name = "bsql"
version = "0.1.2"
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
[lints]
workspace = true

[dependencies]
bsql_derive = { version = "0.1.1", optional = true }
chrono = { version = "0.4.45", default-features = false, optional = true }
libsqlite3-sys = "0.38.2"
uuid = { version = "1.25", optional = true }

[dev-dependencies]
anyhow = "1.0"
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
uuid = { version = "1.25", features = ["v7"] }

[features]
default = ["derive", "sqlite"]
chrono = ["dep:chrono"]
derive = ["dep:bsql_derive"]
sqlite = []
sqlite-bundled = ["sqlite", "libsqlite3-sys/bundled"]
uuid = ["dep:uuid"]
