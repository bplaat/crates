[package]
name = "bob"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
basic-toml = "0.1.10"
directories = "6.0"
dotenv = "0.15.0"
plist = "1.10"
regex = { version = "1.13", default-features = false, features = [
    "unicode-perl",
] }
serde = { version = "1.0", features = ["derive"] }
sha1 = "0.11.0"
terminal_size = "0.4.4"
threadpool = "2.0"

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.3.1"
