[package]
name = "qoi-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[package.metadata]
platforms = ["macos"]

[package.metadata.bundle]
name = "QOI Viewer"
identifier = "nl.bplaat.QOIViewer"
copyright = "Copyright (c) 2026 Bastiaan van der Plaat"
entitlements = "Entitlements.plist"

[[package.metadata.bundle.appex]]
name = "QOI Preview"
identifier = "nl.bplaat.QOIViewer.Preview"
package = "../qoi-viewer-preview"
binary = "qoi-viewer-preview"
info_plist = "../qoi-viewer-preview/Info.plist"
entitlements = "../qoi-viewer-preview/Entitlements.plist"

[[package.metadata.bundle.appex]]
name = "QOI Thumbnail"
identifier = "nl.bplaat.QOIViewer.Thumbnail"
package = "../qoi-viewer-thumbnail"
binary = "qoi-viewer-thumbnail"
info_plist = "../qoi-viewer-thumbnail/Info.plist"
entitlements = "../qoi-viewer-thumbnail/Entitlements.plist"

[lints]
workspace = true

[dependencies]
objc2 = "0.6"
qoi = { path = "../../lib/qoi" }
qoi-appkit = { path = "../../lib/qoi-appkit" }
