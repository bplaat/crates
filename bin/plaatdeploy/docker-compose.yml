services:
  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-data:/data
    networks:
      - plaatdeploy

  plaatdeploy:
    build:
      context: ../..
      dockerfile: bin/plaatdeploy/Dockerfile
    image: ghcr.io/bplaat/plaatdeploy:latest
    restart: unless-stopped
    environment:
      SERVER_ORIGIN: https://${PLAATDEPLOY_DOMAIN}
      DEPLOYMENTS_DOMAIN: ${DEPLOYMENTS_DOMAIN:?Set DEPLOYMENTS_DOMAIN to a wildcard domain such as *.apps.example.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - plaatdeploy-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - plaatdeploy
    labels:
      traefik.enable: 'true'
      traefik.http.routers.plaatdeploy.rule: Host(`${PLAATDEPLOY_DOMAIN}`)
      traefik.http.routers.plaatdeploy.entrypoints: websecure
      traefik.http.routers.plaatdeploy.tls.certresolver: letsencrypt
      traefik.http.services.plaatdeploy.loadbalancer.server.port: '8080'

volumes:
  plaatdeploy-data:
  traefik-data:

networks:
  plaatdeploy:
    external: true
