[package]
name = "sequelexplorer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[package.metadata.bundle]
name = "Sequel Explorer"
identifier = "nl.bplaat.SequelExplorer"
copyright = "Copyright © 2026 Bastiaan van der Plaat"
icon = "meta/macos/icon.icon"
info_plist = "meta/macos/Info.plist"
hardened_runtime = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
base64 = "0.23.1"
bsql = { version = "0.1.2", features = ["mysql", "mysql-native-password"] }
bwebview = { path = "../../lib/bwebview", features = [
    "rust-embed",
    "dialog",
    "file_drop",
    "menu",
] }
rust-embed = "8.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7.1"
small-http = { version = "0.2.1", default-features = false, features = [
    "json",
] }
small-router = { version = "0.2.1" }
url = { version = "2.5" }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
bsql = { version = "0.1.2", features = ["sqlite-bundled"] }

[build-dependencies]
winresource = "0.1.31"
