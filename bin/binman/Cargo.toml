[package]
name = "binman"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[package.metadata]
platforms = ["windows"]

[package.metadata.app]
name = "Binman"

[lints]
workspace = true

[dependencies]
anyhow = "1"
bwebview = { path = "../../lib/bwebview", features = ["progress_bar", "rust-embed"] }
glob = "0.3"
rust-embed = { path = "../../lib/rust-embed" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
winresource = { path = "../../lib/winresource" }
