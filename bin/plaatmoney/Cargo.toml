[package]
name = "plaatmoney"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
bsql = "0.1.2"
csv = "1.3"
log = "0.4.34"
mime_guess = { version = "2.0", default-features = false }
rust-embed = { version = "8.12", features = ["interpolate-folder-path"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7.1"
simple_logger = "5.2"
small-http = { version = "0.2.1", features = ["json", "log", "tls"] }
small-router = { version = "0.2.1", features = ["log"] }
small-websocket = { path = "../../lib/small-websocket", default-features = false }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
native-tls = { version = "0.2.18", features = ["vendored"] }
bsql = { version = "0.1.2", features = ["sqlite-bundled"] }

[build-dependencies]
copy_dir = "0.1.3"
