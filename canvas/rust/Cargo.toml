cargo-features = ["panic-immediate-abort"]

[package]
name = "canvas"
version = "0.1.0"
edition = "2024"
[dependencies]
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }

[profile.release]
opt-level = "s"
panic = "immediate-abort"
lto = false
codegen-units = 1
